<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoNoise · teste do comprovante</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #6b6b6b);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f2);
    --accent: var(--tg-theme-button-color, #2a7ae2);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  dl { background: var(--card); border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; }
  dt { color: var(--hint); font-size: 14px; }
  dd { margin: 0 0 8px; overflow-wrap: anywhere; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 160px;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: var(--card);
    color: var(--fg);
    font: 13px/1.4 ui-monospace, Consolas, monospace;
  }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 16px;
  }
  .dica { color: var(--hint); font-size: 14px; }
</style>
</head>
<body>
<h1>Teste do comprovante</h1>
<div id="conteudo"></div>
<script>
  // Página da fase 0: mostra os dados que o Telegram entrega ao abrir o Mini App,
  // para conferir a assinatura no PC. Nada é enviado para lugar nenhum.
  (function () {
    const tg = window.Telegram && window.Telegram.WebApp;
    const alvo = document.getElementById('conteudo');
    const bruto = tg ? tg.initData : '';

    function paragrafo(texto, classe) {
      const p = document.createElement('p');
      p.textContent = texto;
      if (classe) p.className = classe;
      alvo.appendChild(p);
    }

    if (!bruto) {
      paragrafo('Nenhum dado do Telegram. Abra esta página pelo link do bot, dentro do Telegram.', 'dica');
      return;
    }

    tg.ready();
    tg.expand();

    const campos = new URLSearchParams(bruto);
    let usuario = {};
    try { usuario = JSON.parse(campos.get('user') || '{}'); } catch (e) { usuario = {}; }
    const abertoEm = campos.get('auth_date')
      ? new Date(Number(campos.get('auth_date')) * 1000).toLocaleString('pt-BR')
      : '(ausente)';

    const lista = document.createElement('dl');
    function linha(rotulo, valor) {
      const dt = document.createElement('dt');
      dt.textContent = rotulo;
      const dd = document.createElement('dd');
      dd.textContent = valor;
      lista.append(dt, dd);
    }
    linha('Assinatura para terceiros (signature)', campos.has('signature') ? 'presente' : 'AUSENTE');
    linha('Parâmetro do link (start_param)', campos.get('start_param') || '(ausente)');
    linha('Usuário', usuario.id ? usuario.id + ' (' + (usuario.first_name || '') + ')' : '(ausente)');
    linha('Aberto em', abertoEm);
    alvo.appendChild(lista);

    const area = document.createElement('textarea');
    area.readOnly = true;
    area.value = bruto;
    alvo.appendChild(area);

    const botao = document.createElement('button');
    botao.textContent = 'Copiar dados';
    botao.addEventListener('click', async function () {
      try {
        await navigator.clipboard.writeText(bruto);
      } catch (e) {
        area.select();
        document.execCommand('copy');
      }
      botao.textContent = 'Copiado';
    });
    alvo.appendChild(botao);

    paragrafo('Cole o texto copiado em "Mensagens salvas" no Telegram para pegá-lo no PC.', 'dica');
  })();
</script>
</body>
</html>
